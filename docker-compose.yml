services:
  discord-ai-bot:
    build: .
    container_name: ditri_ai_bot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN
      - TELEGRAM_TOKEN
      - TELEGRAM_ADMIN_ID
      - API_URL
      - API_KEY
      - API_MODEL
      - API_TIMEOUT
      - SYSTEM_PROMPT
      - MAX_HISTORY
      - RATE_LIMIT_CALLS
      - RATE_LIMIT_WINDOW
      - LOG_LEVEL
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
