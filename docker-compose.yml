services:
  discord-ai-bot:
    build: .
    container_name: ditri_ai_bot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN
      - TELEGRAM_TOKEN
      - API_URL
      - API_KEY
      - API_MODEL
      - API_TIMEOUT
      - SYSTEM_PROMPT
      - MAX_HISTORY
      - RATE_LIMIT_CALLS
      - RATE_LIMIT_WINDOW
      - LOG_LEVEL
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - internal_net

networks:
  internal_net:
    name: internal_net
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1280
    ipam:
      config:
        - subnet: 172.20.0.0/24
